
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>VR Mobile — Hand Tracking</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
    }

    #webcam, #canvas-3d {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #webcam {
      z-index: 1;
      object-fit: cover;
      background: #000;
    }

    #canvas-3d {
      z-index: 2;
      pointer-events: none;
      display: block;
    }

    #vr-divider {
      position: fixed;
      top: 0;
      left: 50%;
      width: 2px;
      height: 100%;
      background: rgba(255,255,255,.5);
      z-index: 6;
      display: none;
      pointer-events: none;
    }

    body.vr-mode #vr-divider {
      display: block;
    }

    #ui-container {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(12px, env(safe-area-inset-top)) 12px
               max(14px, env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.17);
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .brand {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #00e5ff;
    }

    .score-badge {
      font-size: 19px;
      font-weight: 800;
      color: #ffd700;
      white-space: nowrap;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      padding: 7px 10px;
      border-radius: 30px;
      background: #333;
      color: #ddd;
      max-width: 150px;
    }

    .status-badge.active {
      color: #fff;
      background: #147b46;
      box-shadow: 0 0 12px rgba(0,255,120,.2);
    }

    .hud-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .hint {
      padding: 8px 12px;
      background: rgba(0,0,0,.65);
      border-radius: 20px;
      font-size: 11px;
      text-align: center;
      color: rgba(255,255,255,.85);
    }

    .hud-controls {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      pointer-events: auto;
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,.3);
      background: rgba(15,20,30,.88);
      color: white;
      padding: 12px 15px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .btn:active {
      transform: scale(.96);
      background: #303a4b;
    }

    #msg-overlay {
      position: fixed;
      z-index: 30;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      width: min(88%, 380px);
      padding: 18px;
      border: 1px solid rgba(0,229,255,.4);
      border-radius: 16px;
      background: rgba(5,8,15,.96);
      box-shadow: 0 0 35px rgba(0,229,255,.12);
      text-align: center;
      line-height: 1.5;
      font-size: 14px;
      overflow-wrap: anywhere;
      display: none;
      pointer-events: auto;
    }

    #msg-overlay button {
      margin-top: 12px;
      padding: 10px 18px;
      border: 0;
      border-radius: 20px;
      background: #00bcd4;
      color: #001014;
      font-weight: 800;
    }

    .hand-legend {
      display: flex;
      gap: 12px;
      font-size: 10px;
      color: #eee;
    }

    .legend-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 4px;
    }

    @media (max-width: 380px) {
      .brand { display: none; }
      .btn { padding: 11px 12px; }
      .status-badge { font-size: 10px; }
    }
  </style>
</head>

<body>
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas-3d"></canvas>
  <div id="vr-divider"></div>

  <div id="ui-container">
    <div class="hud-header">
      <div>
        <div class="brand">HAND VR SYSTEM</div>
        <div class="score-badge">🪙 <span id="score-val">0</span></div>
      </div>

      <div class="hand-legend">
        <span><i class="legend-dot" style="background:#00e5ff"></i>Mão 1</span>
        <span><i class="legend-dot" style="background:#ff9900"></i>Mão 2</span>
      </div>

      <div id="hand-status" class="status-badge">Inicializando...</div>
    </div>

    <div class="hud-bottom">
      <div class="hint">Use as pontas dos indicadores para coletar moedas</div>
      <div class="hud-controls">
        <button class="btn" id="btn-switch-cam">🔄 Câmera</button>
        <button class="btn" id="btn-toggle-vr">🥽 Modo VR</button>
        <button class="btn" id="btn-reset">↻ Reiniciar</button>
      </div>
    </div>
  </div>

  <div id="msg-overlay"></div>

  <script>
  (() => {
    'use strict';

    // ==================================================
    // CONFIGURAÇÕES
    // ==================================================

    const MAX_HANDS = 2;
    const NUM_COINS = 3;
    const COIN_POINTS = 10;

    const HAND_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],
      [0,5],[5,6],[6,7],[7,8],
      [5,9],[9,10],[10,11],[11,12],
      [9,13],[13,14],[14,15],[15,16],
      [13,17],[17,18],[18,19],[19,20],
      [0,17]
    ];

    let score = 0;
    let isVRMode = false;
    let facingMode = 'environment';

    let scene = null;
    let camera3D = null;
    let renderer = null;
    let video = null;
    let detector = null;
    let cameraUtils = null;

    let initialized = false;
    let switchingCamera = false;
    let processingFrame = false;
    let lastFrameTime = 0;
    let cameraGeneration = 0;
    let errorTimer = null;

    const handRigs = [];
    const coins = [];

    const statusElement = document.getElementById('hand-status');
    const scoreElement = document.getElementById('score-val');
    const errorElement = document.getElementById('msg-overlay');

    // ==================================================
    // UTILITÁRIOS
    // ==================================================

    function setStatus(message, active = false) {
      statusElement.textContent = message;
      statusElement.classList.toggle('active', active);
    }

    function showError(message) {
      errorElement.replaceChildren();

      const text = document.createElement('div');
      text.textContent = message;
      errorElement.appendChild(text);

      const close = document.createElement('button');
      close.textContent = 'Fechar';
      close.onclick = () => {
        errorElement.style.display = 'none';
      };

      errorElement.appendChild(close);
      errorElement.style.display = 'block';

      clearTimeout(errorTimer);
      errorTimer = setTimeout(() => {
        errorElement.style.display = 'none';
      }, 9000);
    }

    // ==================================================
    // MOTOR 3D
    // ==================================================

    function init3D() {
      const canvas = document.getElementById('canvas-3d');

      scene = new THREE.Scene();

      camera3D = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );

      camera3D.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({
        canvas,
        alpha: true,
        antialias: false,
        powerPreference: 'high-performance'
      });

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 1.5)
      );

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x000000, 0);
      renderer.autoClear = true;

      scene.add(new THREE.AmbientLight(0xffffff, 1.1));

      const light = new THREE.DirectionalLight(0xffffff, 1.2);
      light.position.set(0, 5, 8);
      scene.add(light);

      for (let i = 0; i < MAX_HANDS; i++) {
        createHandRig(i);
      }

      createCoins();

      window.addEventListener('resize', resize3D);
    }

    // ==================================================
    // ESQUELETOS INDEPENDENTES
    // ==================================================

    function createHandRig(handIndex) {
      const joints = [];
      const bones = [];

      const color = handIndex === 0 ? 0x00e5ff : 0xff9900;

      const jointMaterial = new THREE.MeshStandardMaterial({
        color: color,
        emissive: color,
        emissiveIntensity: 0.12,
        roughness: 0.25,
        metalness: 0.4
      });

      const indexMaterial = new THREE.MeshStandardMaterial({
        color: 0xff0055,
        emissive: 0xff0055,
        emissiveIntensity: 0.7
      });

      const jointGeometry = new THREE.SphereGeometry(0.065, 10, 8);
      const indexGeometry = new THREE.SphereGeometry(0.11, 12, 10);

      for (let i = 0; i < 21; i++) {
        const joint = new THREE.Mesh(
          i === 8 ? indexGeometry : jointGeometry,
          i === 8 ? indexMaterial : jointMaterial
        );

        joint.visible = false;
        scene.add(joint);
        joints.push(joint);
      }

      const boneMaterial = new THREE.MeshBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.85,
        depthWrite: false
      });

      const boneGeometry = new THREE.CylinderGeometry(
        0.025, 0.025, 1, 6
      );

      for (let i = 0; i < HAND_CONNECTIONS.length; i++) {
        const bone = new THREE.Mesh(boneGeometry, boneMaterial);

        bone.visible = false;
        scene.add(bone);
        bones.push(bone);
      }

      handRigs.push({ joints, bones });
    }

    function hideHand(index) {
      const rig = handRigs[index];
      if (!rig) return;

      rig.joints.forEach(joint => {
        joint.visible = false;
      });

      rig.bones.forEach(bone => {
        bone.visible = false;
      });
    }

    function hideAllHands() {
      for (let i = 0; i < MAX_HANDS; i++) {
        hideHand(i);
      }
    }

    // ==================================================
    // COORDENADAS DA CÂMERA PARA O ESPAÇO 3D
    // ==================================================

    function landmarkToWorld(lm) {
      const z = -5;

      const visibleHeight =
        2 * Math.tan(THREE.MathUtils.degToRad(camera3D.fov / 2))
        * Math.abs(z);

      const visibleWidth = visibleHeight * camera3D.aspect;

      // A câmera frontal aparece espelhada no vídeo.
      const xNormalized = facingMode === 'user'
        ? 0.5 - lm.x
        : lm.x - 0.5;

      return new THREE.Vector3(
        xNormalized * visibleWidth,
        (0.5 - lm.y) * visibleHeight,
        z
      );
    }

    // ==================================================
    // ATUALIZAR CADA MÃO
    // ==================================================

    function updateHand(handIndex, landmarks) {
      const rig = handRigs[handIndex];

      if (!landmarks || landmarks.length < 21) {
        hideHand(handIndex);
        return;
      }

      for (let i = 0; i < 21; i++) {
        rig.joints[i].position.copy(
          landmarkToWorld(landmarks[i])
        );
        rig.joints[i].visible = true;
      }

      for (let i = 0; i < HAND_CONNECTIONS.length; i++) {
        const connection = HAND_CONNECTIONS[i];
        const start = rig.joints[connection[0]].position;
        const end = rig.joints[connection[1]].position;
        const bone = rig.bones[i];

        const direction = new THREE.Vector3()
          .subVectors(end, start);

        const length = direction.length();

        if (length < 0.001) {
          bone.visible = false;
          continue;
        }

        bone.position.copy(start).add(end).multiplyScalar(0.5);

        bone.quaternion.setFromUnitVectors(
          new THREE.Vector3(0, 1, 0),
          direction.normalize()
        );

        bone.scale.set(1, length, 1);
        bone.visible = true;
      }

      // Cada mão verifica a ponta do próprio indicador.
      checkCollisions(rig.joints[8].position);
    }

    // ==================================================
    // RESULTADOS DO MEDIAPIPE
    // ==================================================

    function onHandResults(results) {
      const landmarks = results.multiHandLandmarks || [];
      const count = Math.min(landmarks.length, MAX_HANDS);

      for (let i = 0; i < MAX_HANDS; i++) {
        if (i < count) {
          updateHand(i, landmarks[i]);
        } else {
          hideHand(i);
        }
      }

      if (count === 0) {
        setStatus('Nenhuma mão detectada', false);
      } else if (count === 1) {
        setStatus('1 mão detectada', true);
      } else {
        setStatus('2 mãos detectadas', true);
      }
    }

    // ==================================================
    // MOEDAS
    // ==================================================

    function createCoins() {
      const geometry = new THREE.CylinderGeometry(
        0.24, 0.24, 0.07, 24
      );

      const material = new THREE.MeshStandardMaterial({
        color: 0xffd700,
        metalness: 0.85,
        roughness: 0.2,
        emissive: 0x996600,
        emissiveIntensity: 0.3
      });

      for (let i = 0; i < NUM_COINS; i++) {
        const coin = new THREE.Mesh(geometry, material);

        coin.rotation.x = Math.PI / 2;
        coin.userData.floatOffset = i * 2.1;

        resetCoin(coin);

        scene.add(coin);
        coins.push(coin);
      }
    }

    function resetCoin(coin) {
      coin.position.set(
        (Math.random() - 0.5) * 5,
        (Math.random() - 0.5) * 3.5,
        -5
      );
    }

    function checkCollisions(tipPosition) {
      for (const coin of coins) {
        if (coin.position.distanceTo(tipPosition) < 0.38) {
          score += COIN_POINTS;
          scoreElement.textContent = String(score);

          resetCoin(coin);
        }
      }
    }

    function resetGame() {
      score = 0;
      scoreElement.textContent = '0';

      coins.forEach(resetCoin);
      hideAllHands();
    }

    // ==================================================
    // CÂMERA
    // ==================================================

    async function stopCamera() {
      const oldCamera = cameraUtils;
      cameraUtils = null;

      if (oldCamera) {
        try {
          oldCamera.stop();
        } catch (error) {
          console.warn('Não foi possível parar a câmera:', error);
        }
      }

      if (video && video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
        video.srcObject = null;
      }

      hideAllHands();
    }

    async function startCamera(mode) {
      if (switchingCamera || !detector) return;

      switchingCamera = true;
      const generation = ++cameraGeneration;

      setStatus('Iniciando câmera...', false);

      try {
        await stopCamera();

        if (generation !== cameraGeneration) return;

        facingMode = mode;

        video.style.transform = mode === 'user'
          ? 'scaleX(-1)'
          : 'scaleX(1)';

        cameraUtils = new Camera(video, {
          width: 640,
          height: 480,
          facingMode: mode,

          onFrame: async () => {
            if (
              generation !== cameraGeneration ||
              !detector ||
              !video.videoWidth ||
              processingFrame
            ) {
              return;
            }

            const now = performance.now();

            // Limita o processamento para melhorar o desempenho.
            if (now - lastFrameTime < 33) return;

            lastFrameTime = now;
            processingFrame = true;

            try {
              await detector.send({ image: video });
            } catch (error) {
              console.warn('Erro ao processar imagem:', error);
            } finally {
              processingFrame = false;
            }
          }
        });

        await cameraUtils.start();

        if (generation === cameraGeneration) {
          setStatus('Câmera ativa — procurando mãos', false);
        }
      } catch (error) {
        console.error('Erro de câmera:', error);

        if (generation === cameraGeneration) {
          setStatus('Câmera indisponível', false);

          showError(
            'Não foi possível abrir a câmera. Permita o acesso nas ' +
            'configurações do Safari e abra o jogo por HTTPS. Detalhe: ' +
            (error.message || 'erro desconhecido')
          );
        }
      } finally {
        switchingCamera = false;
      }
    }

    async function initMediaPipe() {
      if (typeof Hands === 'undefined' || typeof Camera === 'undefined') {
        setStatus('Falha ao carregar MediaPipe', false);

        showError(
          'Não foi possível carregar os arquivos do MediaPipe. ' +
          'Verifique sua conexão com a internet e recarregue a página.'
        );

        return;
      }

      try {
        detector = new Hands({
          locateFile: file =>
            'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + file
        });

        detector.setOptions({
          maxNumHands: MAX_HANDS,
          modelComplexity: 1,
          minDetectionConfidence: 0.6,
          minTrackingConfidence: 0.6
        });

        detector.onResults(onHandResults);

        await startCamera(facingMode);
      } catch (error) {
        console.error('Erro no MediaPipe:', error);
        setStatus('Falha no rastreamento', false);

        showError(
          'Erro ao inicializar o rastreamento: ' +
          (error.message || 'erro desconhecido')
        );
      }
    }

    // ==================================================
    // REDIMENSIONAMENTO E VR
    // ==================================================

    function resize3D() {
      if (!renderer || !camera3D) return;

      camera3D.aspect = window.innerWidth / window.innerHeight;
      camera3D.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (!renderer || !scene || !camera3D) return;

      const time = performance.now() * 0.001;

      coins.forEach(coin => {
        coin.rotation.y += 0.025;
        coin.position.y +=
          Math.sin(time * 2 + coin.userData.floatOffset) * 0.001;
      });

      const width = window.innerWidth;
      const height = window.innerHeight;

      if (isVRMode) {
        const half = Math.floor(width / 2);

        renderer.setScissorTest(true);

        renderer.setViewport(0, 0, half, height);
        renderer.setScissor(0, 0, half, height);
        renderer.render(scene, camera3D);

        renderer.setViewport(half, 0, width - half, height);
        renderer.setScissor(half, 0, width - half, height);
        renderer.render(scene, camera3D);

        renderer.setScissorTest(false);
      } else {
        renderer.setViewport(0, 0, width, height);
        renderer.setScissorTest(false);
        renderer.render(scene, camera3D);
      }
    }

    // ==================================================
    // BOTÕES
    // ==================================================

    document.getElementById('btn-switch-cam').addEventListener('click', async () => {
      if (switchingCamera) return;

      const nextMode = facingMode === 'environment'
        ? 'user'
        : 'environment';

      await startCamera(nextMode);
    });

    document.getElementById('btn-toggle-vr').addEventListener('click', () => {
      isVRMode = !isVRMode;

      document.body.classList.toggle('vr-mode', isVRMode);

      document.getElementById('btn-toggle-vr').textContent =
        isVRMode ? '📱 Sair do VR' : '🥽 Modo VR';

      resize3D();
    });

    document.getElementById('btn-reset').addEventListener('click', resetGame);

    // ==================================================
    // INICIALIZAÇÃO SEGURA
    // ==================================================

    async function init() {
      if (initialized) return;
      initialized = true;

      try {
        video = document.getElementById('webcam');

        if (typeof THREE === 'undefined') {
          throw new Error('Three.js não foi carregado.');
        }

        init3D();
        animate();

        await initMediaPipe();
      } catch (error) {
        console.error('Falha na inicialização:', error);

        setStatus('Erro ao iniciar jogo', false);

        showError(
          'O jogo não conseguiu iniciar. Confira sua conexão e recarregue. ' +
          (error.message || '')
        );
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init, { once: true });
    } else {
      init();
    }
  })();
  </script>
</body>
</html>


<script>
(() => {
  'use strict';

  // =====================================================
  // CONFIGURAÇÕES
  // =====================================================
  const MAX_HANDS = 2;
  const NUM_COLLECTIBLES = 3;
  const CONNECTIONS = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],
    [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],
    [0,17]
  ];

  let score = 0;
  let isVRMode = false;
  let facingMode = 'environment';
  let video, renderer, scene, camera, detector, cameraUtils;
  let cameraStarting = false;
  let cameraRequestId = 0;
  let lastFrameTime = 0;

  const handRigs = [];
  const collectibles = [];

  const statusElement = document.getElementById('hand-status');
  const scoreElement = document.getElementById('score-val');
  const errorElement = document.getElementById('msg-overlay');

  // =====================================================
  // CENA 3D
  // =====================================================
  function init3D() {
    video = document.getElementById('webcam');

    const canvas = document.getElementById('canvas-3d');

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    camera.position.set(0, 0, 0);

    renderer = new THREE.WebGLRenderer({
      canvas,
      alpha: true,
      antialias: true,
      powerPreference: 'high-performance'
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setScissorTest(false);

    scene.add(new THREE.AmbientLight(0xffffff, 1.1));

    const light = new THREE.DirectionalLight(0xffffff, 1.3);
    light.position.set(0, 5, 8);
    scene.add(light);

    // Cada mão recebe seu próprio esqueleto.
    for (let h = 0; h < MAX_HANDS; h++) {
      createHandRig(h);
    }

    createCollectibles();

    window.addEventListener('resize', resize3D);
  }

  function createHandRig(handIndex) {
    const joints = [];
    const bones = [];

    // Cores diferentes para distinguir as mãos.
    const color = handIndex === 0 ? 0x00e5ff : 0xff9d00;

    const jointMaterial = new THREE.MeshStandardMaterial({
      color,
      metalness: 0.55,
      roughness: 0.25,
      emissive: color,
      emissiveIntensity: 0.12
    });

    const indexMaterial = new THREE.MeshStandardMaterial({
      color: 0xff0055,
      emissive: 0xff0055,
      emissiveIntensity: 0.8,
      roughness: 0.2
    });

    const jointGeometry = new THREE.SphereGeometry(0.065, 12, 10);
    const indexGeometry = new THREE.SphereGeometry(0.105, 14, 12);

    for (let i = 0; i < 21; i++) {
      const joint = new THREE.Mesh(
        i === 8 ? indexGeometry : jointGeometry,
        i === 8 ? indexMaterial : jointMaterial
      );

      joint.visible = false;
      scene.add(joint);
      joints.push(joint);
    }

    const boneMaterial = new THREE.MeshStandardMaterial({
      color,
      emissive: color,
      emissiveIntensity: 0.15,
      transparent: true,
      opacity: 0.85
    });

    const boneGeometry = new THREE.CylinderGeometry(0.025, 0.025, 1, 8);

    for (let i = 0; i < CONNECTIONS.length; i++) {
      const bone = new THREE.Mesh(boneGeometry, boneMaterial);
      bone.visible = false;
      scene.add(bone);
      bones.push(bone);
    }

    handRigs.push({
      joints,
      bones,
      visible: false,
      lastSeen: 0
    });
  }

  // =====================================================
  // MOEDAS COLETÁVEIS
  // =====================================================
  function createCollectibles() {
    const geometry = new THREE.CylinderGeometry(0.22, 0.22, 0.065, 24);

    const material = new THREE.MeshStandardMaterial({
      color: 0xffd700,
      metalness: 0.9,
      roughness: 0.18,
      emissive: 0xaa7700,
      emissiveIntensity: 0.3
    });

    for (let i = 0; i < NUM_COLLECTIBLES; i++) {
      const coin = new THREE.Mesh(geometry, material);

      coin.rotation.x = Math.PI / 2;
      coin.userData.collected = false;

      resetCollectible(coin);

      scene.add(coin);
      collectibles.push(coin);
    }
  }

  function resetCollectible(coin) {
    coin.position.set(
      (Math.random() - 0.5) * 5,
      (Math.random() - 0.5) * 3.5,
      -4.5 - Math.random() * 2
    );
  }

  // =====================================================
  // CONVERSÃO DE COORDENADAS
  // =====================================================
  function landmarkToWorld(landmark) {
    const depth = THREE.MathUtils.clamp(
      -landmark.z * 2,
      -0.5,
      0.8
    );

    const z = -4.5 + depth;

    // Converte as coordenadas normalizadas da câmera
    // para coordenadas compatíveis com a perspectiva 3D.
    const visibleHeight =
      2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * Math.abs(z);

    const visibleWidth = visibleHeight * camera.aspect;

    let normalizedX = landmark.x - 0.5;

    // A câmera frontal é espelhada visualmente.
    if (facingMode === 'user') {
      normalizedX = -normalizedX;
    }

    return new THREE.Vector3(
      normalizedX * visibleWidth,
      (0.5 - landmark.y) * visibleHeight,
      z
    );
  }

  // =====================================================
  // ATUALIZAÇÃO DE CADA ESQUELETO
  // =====================================================
  function updateHand(rig, landmarks) {
    if (!landmarks || landmarks.length < 21) {
      hideRig(rig);
      return;
    }

    for (let i = 0; i < 21; i++) {
      const position = landmarkToWorld(landmarks[i]);

      rig.joints[i].position.copy(position);
      rig.joints[i].visible = true;
    }

    for (let i = 0; i < CONNECTIONS.length; i++) {
      const [a, b] = CONNECTIONS[i];

      const start = rig.joints[a].position;
      const end = rig.joints[b].position;

      const bone = rig.bones[i];
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();

      if (length < 0.001) {
        bone.visible = false;
        continue;
      }

      bone.position.copy(start).add(end).multiplyScalar(0.5);

      // O cilindro do Three.js aponta inicialmente para o eixo Y.
      bone.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );

      bone.scale.set(1, length, 1);
      bone.visible = true;
    }

    rig.visible = true;
    rig.lastSeen = performance.now();

    // A ponta do indicador de cada mão coleta moedas.
    checkCollisions(rig.joints[8].position);
  }

  function hideRig(rig) {
    rig.visible = false;

    rig.joints.forEach(joint => {
      joint.visible = false;
    });

    rig.bones.forEach(bone => {
      bone.visible = false;
    });
  }

  function hideAllHands() {
    handRigs.forEach(hideRig);
  }

  // =====================================================
  // RESULTADOS DO MEDIAPIPE
  // =====================================================
  function onHandResults(results) {
    const allLandmarks = results.multiHandLandmarks || [];
    const count = Math.min(allLandmarks.length, MAX_HANDS);

    // Atualiza cada mão detectada.
    for (let i = 0; i < count; i++) {
      updateHand(handRigs[i], allLandmarks[i]);
    }

    // Esconde os esqueletos que não receberam landmarks.
    for (let i = count; i < MAX_HANDS; i++) {
      hideRig(handRigs[i]);
    }

    statusElement.classList.toggle('active', count > 0);

    if (count === 0) {
      statusElement.textContent = 'Nenhuma mão detectada';
    } else if (count === 1) {
      statusElement.textContent = '1 mão detectada';
    } else {
      statusElement.textContent = '2 mãos detectadas';
    }

    statusElement.title = count + ' de ' + MAX_HANDS + ' mãos rastreadas';
  }

  // =====================================================
  // COLISÕES E PONTUAÇÃO
  // =====================================================
  function checkCollisions(tipPosition) {
    for (const coin of collectibles) {
      if (coin.userData.collected) continue;

      if (coin.position.distanceTo(tipPosition) < 0.42) {
        coin.userData.collected = true;

        score += 10;
        scoreElement.textContent = score;

        // Reposiciona imediatamente para evitar pontuação repetida.
        resetCollectible(coin);
        coin.userData.collected = false;
      }
    }
  }

  // =====================================================
  // CÂMERA E MEDIAPIPE
  // =====================================================
  async function initCameraAndHands() {
    statusElement.textContent = 'Inicializando rastreamento...';

    try {
      detector = new Hands({
        locateFile: file =>
          'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + file
      });

      detector.setOptions({
        maxNumHands: MAX_HANDS,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });

      detector.onResults(onHandResults);

      await startCamera(facingMode);
    } catch (error) {
      showError('Não foi possível iniciar o rastreamento: ' + error.message);
      statusElement.textContent = 'Erro na inicialização';
    }
  }

  async function stopCamera() {
    if (cameraUtils) {
      try {
        cameraUtils.stop();
      } catch (error) {
        console.warn('Erro ao parar a câmera:', error);
      }

      cameraUtils = null;
    }

    // Libera também a câmera se o navegador mantiver a stream ativa.
    if (video && video.srcObject) {
      video.srcObject.getTracks().forEach(track => track.stop());
      video.srcObject = null;
    }

    hideAllHands();
  }

  async function startCamera(facing) {
    if (!detector || cameraStarting) {
      if (cameraStarting) {
        showError('Aguarde a inicialização atual da câmera.');
      }
      return;
    }

    cameraStarting = true;
    const requestId = ++cameraRequestId;

    try {
      await stopCamera();

      facingMode = facing;

      video.style.transform =
        facingMode === 'user' ? 'scaleX(-1)' : 'scaleX(1)';

      statusElement.textContent = 'Abrindo câmera...';

      if (requestId !== cameraRequestId) return;

      cameraUtils = new Camera(video, {
        onFrame: async () => {
          if (!detector || !video.videoWidth || requestId !== cameraRequestId) {
            return;
          }

          // Evita enviar vários frames simultâneos ao modelo.
          const now = performance.now();

          if (now - lastFrameTime < 33) return;
          lastFrameTime = now;

          try {
            await detector.send({ image: video });
          } catch (error) {
            console.warn('Erro no processamento das mãos:', error);
          }
        },
        width: 640,
        height: 480,
        facingMode: facingMode
      });

      await cameraUtils.start();

      if (requestId === cameraRequestId) {
        statusElement.textContent = 'Câmera ativa — procurando mãos';
      }
    } catch (error) {
      if (requestId === cameraRequestId) {
        showError(
          'Não foi possível acessar a câmera. Verifique as permissões e use HTTPS. ' +
          (error.message || '')
        );

        statusElement.textContent = 'Câmera indisponível';
      }
    } finally {
      cameraStarting = false;
    }
  }

  function showError(message) {
    errorElement.textContent = message;
    errorElement.style.display = 'block';

    setTimeout(() => {
      errorElement.style.display = 'none';
    }, 5000);
  }

  // =====================================================
  // MODO VR E REDIMENSIONAMENTO
  // =====================================================
  function resize3D() {
    if (!renderer || !camera) return;

    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate() {
    requestAnimationFrame(animate);

    const time = performance.now() * 0.001;

    collectibles.forEach((coin, index) => {
      coin.rotation.y += 0.025;
      coin.rotation.z += 0.01;
      coin.position.y += Math.sin(time * 2 + index) * 0.0015;
    });

    const width = window.innerWidth;
    const height = window.innerHeight;

    if (isVRMode) {
      const halfWidth = Math.floor(width / 2);

      renderer.setScissorTest(true);

      renderer.setViewport(0, 0, halfWidth, height);
      renderer.setScissor(0, 0, halfWidth, height);
      renderer.render(scene, camera);

      renderer.setViewport(halfWidth, 0, width - halfWidth, height);
      renderer.setScissor(halfWidth, 0, width - halfWidth, height);
      renderer.render(scene, camera);

      renderer.setScissorTest(false);
    } else {
      renderer.setViewport(0, 0, width, height);
      renderer.render(scene, camera);
    }
  }

  // =====================================================
  // CONTROLES
  // =====================================================
  document.getElementById('btn-switch-cam').addEventListener('click', async () => {
    if (cameraStarting) return;

    const nextFacing =
      facingMode === 'environment' ? 'user' : 'environment';

    await startCamera(nextFacing);
  });

  document.getElementById('btn-toggle-vr').addEventListener('click', () => {
    isVRMode = !isVRMode;
    document.body.classList.toggle('vr-mode', isVRMode);
    resize3D();
  });

  // =====================================================
  // INICIALIZAÇÃO
  // =====================================================
  async function init() {
    init3D();
    animate();
    await initCameraAndHands();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init, { once: true });
  } else {
    init();
  }
})();
</script>
